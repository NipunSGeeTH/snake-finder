name: Build and publish APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the bundled model on the sample photos
        run: |
          python -m pip install --upgrade pip
          python -m pip install ai-edge-litert pillow numpy
          mkdir -p dist
          python scripts/check_model.py | tee dist/model-check.txt

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Decode the release keystore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OPHIA_KEYSTORE_BASE64: ${{ secrets.OPHIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OPHIA_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret. Skipping signed release."
            exit 0
          fi
          echo "$OPHIA_KEYSTORE_BASE64" | base64 -d > "$HOME/ophia-release.jks"
          echo "OPHIA_STORE_FILE=$HOME/ophia-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.OPHIA_STORE_FILE != ''
        env:
          OPHIA_STORE_PASSWORD: ${{ secrets.OPHIA_STORE_PASSWORD }}
          OPHIA_KEY_ALIAS: ${{ secrets.OPHIA_KEY_ALIAS }}
          OPHIA_KEY_PASSWORD: ${{ secrets.OPHIA_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Collect APK, tests, and sample photos
        if: always()
        run: |
          mkdir -p dist/tests
          if [ -f androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/snakeid-debug.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/ophia-release.apk
          fi
          cp -r composeApp/build/test-results/testDebugUnitTest/. dist/tests/ || true
          cp -r composeApp/build/reports/tests/testDebugUnitTest dist/tests/html || true
          (cd androidApp/src/main/assets && zip -r "$GITHUB_WORKSPACE/dist/sample-photos.zip" samples)
          (cd dist && zip -r unit-tests.zip tests)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snakeid-debug-apk
          path: dist/snakeid-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ophia-release-apk
          path: dist/ophia-release.apk
          if-no-files-found: warn

      - name: Upload test results and sample photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakeid-test-files
          path: |
            dist/model-check.txt
            dist/unit-tests.zip
            dist/sample-photos.zip
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%d)"
          TITLE="Ophia APK · ${DATE} · ${SHA}"
          NOTES="Ophia APKs built from main at ${SHA} on ${DATE}. Prefer ophia-release.apk for installs. Debug APK is also attached. Install with: adb install -r ophia-release.apk"
          FILES=(dist/snakeid-debug.apk dist/unit-tests.zip dist/model-check.txt dist/sample-photos.zip)
          if [ -f dist/ophia-release.apk ]; then
            FILES+=(dist/ophia-release.apk)
          fi
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "${FILES[@]}" --clobber
            gh release edit latest-apk --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create latest-apk "${FILES[@]}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target main
          fi
